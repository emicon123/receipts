spring:
  application:
    name: receipts-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_absent
  servlet:
    multipart:
      enabled: true
      # A phone photo can be several MB — generous limits per the Backend agent's gotchas list.
      max-file-size: 20MB
      max-request-size: 20MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /api/openapi
  swagger-ui:
    path: /api/docs

receipts:
  storage:
    root-path: ${RECEIPTS_STORAGE_PATH:./data/receipt-images}

logging:
  level:
    pl.receipts: INFO
