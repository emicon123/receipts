spring:
  application:
    name: receipts-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    connection-fetch: lazy
  jpa:
    bootstrap-mode: deferred
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    write:
      default-property-inclusion: non_absent
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    accesslog:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  opentelemetry:
    enabled: true

springdoc:
  api-docs:
    path: /api/openapi
  swagger-ui:
    path: /api/docs

receipts:
  storage:
    root-path: ${RECEIPTS_STORAGE_PATH:./data/receipt-images}

logging:
  level:
    pl.receipts: INFO
