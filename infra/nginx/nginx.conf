# Reverse-proxy + static PWA config for the receipts app.
# Copied into the image at /etc/nginx/conf.d/default.conf by infra/docker/nginx/Dockerfile.
# Same SPA + API-proxy shape as investing-app's infra/nginx/nginx.conf, trimmed down:
# this app has no OAuth, no second client mounted under a path prefix, and (per ADR-004)
# is Tailscale-VPN-only, never Funneled to the public internet — so unlike investing-app
# there is no per-IP rate-limit zone here; that exists there specifically to guard a
# publicly-Funneled port, which this app deliberately never is.

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Security headers. CSP is tight because this PWA has no third-party scripts/fonts/
    # OAuth origins to allow (unlike investing-app) — img-src allows blob:/data: for the
    # client-side camera-preview step (Frontend renders the captured photo via an object/
    # data URL before the user accepts/uploads it).
    add_header X-Frame-Options           "DENY"                              always;
    add_header X-Content-Type-Options    "nosniff"                           always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"   always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'" always;

    # Serve the React PWA static build. index.html (and the SPA-fallback response for
    # client-side routes) must always be revalidated — it's what pins the browser to a
    # specific build's hashed asset filenames.
    location / {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Vite content-hashes every file under /assets/ — a new deploy always ships new
    # filenames, so these are safe to cache aggressively.
    location /assets/ {
        root   /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proxy API calls to Spring Boot. Do NOT strip /api here — the backend's own
    # context-path is /api (see docs/openapi.yaml servers[]) and expects the full path
    # including that prefix, same convention as investing-app.
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 20m;   # phone photos — matches backend's application.yml multipart limit (20MB)
    }
}
